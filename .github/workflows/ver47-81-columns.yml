name: Ver.47.81 table column update

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/ver47-81-columns.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply ver.47.81 changes
        run: |
          python - <<'PY'
          from pathlib import Path

          OLD='47.80'
          NEW='47.81'

          # Version-bearing app files
          for name in ['index.html','app.js','sw.js']:
              p=Path(name)
              text=p.read_text()
              if OLD not in text:
                  raise RuntimeError(f'{OLD} not found in {name}')
              p.write_text(text.replace(OLD,NEW))

          # Shift category and amount columns slightly to the right by widening memo
          # and narrowing the action column, without changing total table width.
          p=Path('style.css')
          css=p.read_text()
          old_memo='.expense-table th:nth-child(2),.expense-table td:nth-child(2),.planned-expense-table th:nth-child(2),.planned-expense-table td:nth-child(2),.fixed-expense-table th:nth-child(2),.fixed-expense-table td:nth-child(2){width:34%;white-space:normal;overflow-wrap:anywhere}'
          new_memo='.expense-table th:nth-child(2),.expense-table td:nth-child(2),.planned-expense-table th:nth-child(2),.planned-expense-table td:nth-child(2),.fixed-expense-table th:nth-child(2),.fixed-expense-table td:nth-child(2){width:36%;white-space:normal;overflow-wrap:anywhere}'
          old_action='.expense-table th:nth-child(5),.expense-table td:nth-child(5),.planned-expense-table th:nth-child(5),.planned-expense-table td:nth-child(5),.fixed-expense-table th:nth-child(5),.fixed-expense-table td:nth-child(5){width:24%}'
          new_action='.expense-table th:nth-child(5),.expense-table td:nth-child(5),.planned-expense-table th:nth-child(5),.planned-expense-table td:nth-child(5),.fixed-expense-table th:nth-child(5),.fixed-expense-table td:nth-child(5){width:22%}'
          if css.count(old_memo) != 1:
              raise RuntimeError(f'Unexpected memo column rule count: {css.count(old_memo)}')
          if css.count(old_action) != 1:
              raise RuntimeError(f'Unexpected action column rule count: {css.count(old_action)}')
          css=css.replace(old_memo,new_memo).replace(old_action,new_action)
          p.write_text(css)

          Path('README.md').write_text(
              '# 家計簿アプリ\n\n'
              '## ver.47.81\n'
              '- 一覧テーブルのカテゴリ列と金額列を少し右寄せ\n'
              '- メモ列を 34% → 36%、操作列を 24% → 22% に調整\n'
              '- 日付・カテゴリ・金額の列幅は維持し、テーブル全体の横幅も変更なし\n'
              '- 今月の支出 / 今月の予定支出 / 固定費一覧の3テーブルへ同じ列幅を適用\n'
              '- index.html / app.js / sw.js / キャッシュ指定 / アプリ下部のバージョンを ver.47.81 に統一\n'
          )
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/ver47-81-columns.yml

      - name: Validate
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          app=Path('app.js').read_text()
          css=Path('style.css').read_text()
          sw=Path('sw.js').read_text()
          readme=Path('README.md').read_text()

          assert 'style.css?v=47.81' in html
          assert 'app.js?v=47.81' in html
          assert 'ver.47.81' in html
          assert 'const VERSION="47.81";' in app
          assert 'money-rule-app-v47.81' in sw
          assert '## ver.47.81' in readme
          assert 'nth-child(2){width:36%' in css
          assert 'nth-child(5){width:22%' in css
          assert 'nth-child(3){width:14%' in css
          assert 'nth-child(4){width:18%' in css
          for name in ['index.html','app.js','sw.js','README.md']:
              assert '47.80' not in Path(name).read_text(), f'Old version remains in {name}'
          PY
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ver.47.81: shift category and amount columns right"
          git push origin develop
