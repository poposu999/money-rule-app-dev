name: Ver.48.14 UI adjustments

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/ver4814-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply ver.48.14 adjustments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # app.js version
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          if 'const VERSION="48.13";' not in s:
              raise SystemExit('expected app.js ver.48.13')
          s=s.replace('const VERSION="48.13";','const VERSION="48.14";',1)
          p.write_text(s,encoding='utf-8')

          # index.html cache/version references
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '48.13' not in s:
              raise SystemExit('expected index.html ver.48.13 references')
          s=s.replace('48.13','48.14')
          p.write_text(s,encoding='utf-8')

          # style.css: square category bars and keep daily edge labels inside chart
          p=Path('style.css')
          s=p.read_text(encoding='utf-8')
          # Replace the category track radius regardless of the current background value.
          s,n=re.subn(r'(\.category-bar-track\{[^}]*?)border-radius:[^;}]+' , r'\1border-radius:0', s, count=1)
          if n!=1:
              raise SystemExit('category-bar-track radius rule not found')

          # Remove older ver.48.14 edge-label block if rerun, then append the canonical rules.
          s=re.sub(r'\n?/\* ver\.48\.14 daily edge labels \*/.*?\n(?=/\*|\Z)','\n',s,flags=re.S)
          s += '''\n/* ver.48.14 daily edge labels */\n#dailyChart .bar-label:first-child{text-align:left}\n#dailyChart .bar-label:last-child{text-align:right}\n'''
          p.write_text(s,encoding='utf-8')

          # README: this version only
          Path('README.md').write_text('''# 家計簿 ver.48.14（検証版）\n\n## ver.48.14の変更点\n- カテゴリ別支出グラフの棒を角張った長方形に変更。\n- 日ごとの支出グラフで1日・月末の日付ラベルが端で見切れないよう配置を調整。\n''',encoding='utf-8')
          PY

          node --check app.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html style.css README.md
          git commit -m 'Adjust graph bar shape and edge labels for ver.48.14'
          git push origin develop
