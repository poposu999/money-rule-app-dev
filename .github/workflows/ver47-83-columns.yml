name: Ver.47.83 table column update

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/ver47-83-columns.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Update Ver.47.83
        run: |
          python3 - <<'PY'
          from pathlib import Path

          style = Path('style.css')
          s = style.read_text()
          old_memo = '.expense-table th:nth-child(2),.expense-table td:nth-child(2),.planned-expense-table th:nth-child(2),.planned-expense-table td:nth-child(2),.fixed-expense-table th:nth-child(2),.fixed-expense-table td:nth-child(2){width:38%;white-space:normal;overflow-wrap:anywhere}'
          new_memo = old_memo.replace('width:38%', 'width:37%')
          old_action = '.expense-table th:nth-child(5),.expense-table td:nth-child(5),.planned-expense-table th:nth-child(5),.planned-expense-table td:nth-child(5),.fixed-expense-table th:nth-child(5),.fixed-expense-table td:nth-child(5){width:20%}'
          new_action = old_action.replace('width:20%', 'width:21%')
          assert old_memo in s, 'memo column rule not found'
          assert old_action in s, 'action column rule not found'
          s = s.replace(old_memo, new_memo, 1).replace(old_action, new_action, 1)
          style.write_text(s)

          for name in ['index.html', 'app.js', 'sw.js']:
              p = Path(name)
              t = p.read_text()
              assert '47.82' in t, f'47.82 not found in {name}'
              p.write_text(t.replace('47.82', '47.83'))

          Path('README.md').write_text('''# 家計簿アプリ\n\n## ver.47.83\n- 一覧テーブルの操作列を 20% → 21% に少し拡大\n- 操作列へ戻した1%分、メモ列を 38% → 37% に調整\n- 日付10% / メモ37% / カテゴリ14% / 金額18% / 操作21% に統一\n- 今月の支出 / 今月の予定支出 / 固定費一覧の3テーブルへ同じ列幅を適用\n- index.html / app.js / sw.js / キャッシュ指定 / アプリ下部のバージョンを ver.47.83 に統一\n''')
          PY

      - name: Validate
        run: |
          node --check app.js
          node --check sw.js
          grep -q 'width:37%;white-space:normal;overflow-wrap:anywhere' style.css
          grep -q 'nth-child(5).*width:21%' style.css
          grep -q 'ver.47.83' README.md
          grep -q 'style.css?v=47.83' index.html
          grep -q 'app.js?v=47.83' index.html
          grep -q 'ver.47.83' index.html
          grep -q 'const VERSION="47.83"' app.js
          grep -q 'money-rule-app-v47.83' sw.js
          grep -q 'style.css?v=47.83' sw.js
          grep -q 'app.js?v=47.83' sw.js
          ! grep -R '47.82' README.md index.html app.js style.css sw.js
          git diff --check

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/ver47-83-columns.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ver.47.83: widen action column to 21 percent'
          git push origin develop
