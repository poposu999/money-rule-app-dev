name: Ver 48.01 update

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/ver48-01.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply changes
        run: python ver48_01_update.py

      - name: Validate source
        run: |
          node --check app.js
          node --check sw.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          persistent = '\n'.join([app, index, sw, readme])
          assert '47.95' not in persistent
          assert 'const VERSION="48.01";' in app
          assert 'id="fixedPendingView"' in index
          assert 'unpaidFixedAmount=state.fixedExpenses.filter(f=>!fixedPaid(f,key))' in app
          assert 'remaining=spendingBudget-spent-plannedAmount-unpaidFixedAmount' in app
          assert 'projected=(!spent&&!planned&&!unpaidFixed)?0:' in app
          assert '$("fixedPendingView").textContent=yen(n.unpaidFixedAmount)' in app
          assert 'style.css?v=48.01' in index
          assert 'app.js?v=48.01' in index
          assert 'ver.48.01' in index
          assert 'money-rule-app-v48.01' in sw
          PY

      - name: Remove temporary files and verify tree
        run: |
          rm -f ver48_01_update.py
          rm -f .github/workflows/ver48-01.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          expected = {'README.md','app.js','index.html','manifest.json','style.css','sw.js'}
          actual = {p.name for p in Path('.').iterdir() if p.name != '.git'}
          if actual != expected:
              raise SystemExit(f'Unexpected top-level tree: {sorted(actual)}')
          PY

      - name: Commit validation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ver.48.01: reserve unpaid fixed expenses in budget"
          git push origin HEAD:develop
