name: Ver.48.01 update

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/ver48-01.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply ver.48.01 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_line(lines, prefix, replacement):
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one line starting with {prefix!r}, found {len(matches)}")
              lines[matches[0]] = replacement

          app_path = Path('app.js')
          app_lines = app_path.read_text(encoding='utf-8').splitlines()

          replace_line(app_lines, 'const VERSION=', 'const VERSION="48.01";')

          replace_line(
              app_lines,
              'function getNumbers()',
              'function getNumbers(){const s=state.settings,totalIncome=state.income+state.bonus,minimum=Math.max(0,Number(s.minimumTakeHome)||0),target=Math.max(0,Number(s.savingsTarget)||0);const allowancePct=Math.min(100,Math.max(0,Number(s.extraAllowancePercent)||0)),savingsPct=Math.min(100,Math.max(0,Number(s.extraSavingsPercent)||0));const extra=Math.max(0,totalIncome-minimum),allowance=extra*allowancePct/100,extraSavings=extra*savingsPct/100,plannedSavings=target+extraSavings;const spendingBudget=Math.max(0,totalIncome-plannedSavings);const es=monthExpenses(),planned=monthPlannedExpenses(),key=monthKey(),spent=es.reduce((a,e)=>a+e.amount,0),plannedAmount=planned.reduce((a,e)=>a+e.amount,0),unpaidFixedAmount=state.fixedExpenses.filter(f=>!fixedPaid(f,key)).reduce((a,f)=>a+f.amount,0),remaining=spendingBudget-spent-plannedAmount-unpaidFixedAmount;return {s,totalIncome,minimum,target,allowancePct,savingsPct,extra,allowance,extraSavings,plannedSavings,spendingBudget,es,planned,spent,plannedAmount,unpaidFixedAmount,remaining};}'
          )

          replace_line(
              app_lines,
              'function calc()',
              'function calc(){const n=getNumbers(),d=getDayInfo();$("incomeView").textContent=yen(n.totalIncome);$("extraIncome").textContent=yen(n.extra);$("plannedSavings").textContent=yen(n.plannedSavings);$("spendingBudget").textContent=yen(n.spendingBudget);$("plannedExpenseView").textContent=yen(n.plannedAmount);$("fixedPendingView").textContent=yen(n.unpaidFixedAmount);renderBudgetDashboard(n,d);renderValidation(n);renderFixedExpenses();renderCategoryChart(n.es);renderDailyChart(n.es);renderMonthlyChart();}'
          )

          replace_line(
              app_lines,
              'function renderBudgetDashboard(',
              'function renderBudgetDashboard(n,d){const budget=Math.max(0,Number(n.spendingBudget)||0),spent=Math.max(0,Number(n.spent)||0),planned=Math.max(0,Number(n.plannedAmount)||0),unpaidFixed=Math.max(0,Number(n.unpaidFixedAmount)||0),remaining=Number(n.remaining)||0,rawPct=budget>0?spent/budget*100:0,pct=Number.isFinite(rawPct)?Math.max(0,rawPct):0,ideal=budget*(d.day/Math.max(1,d.last)),diff=spent-ideal,projected=(!spent&&!planned&&!unpaidFixed)?0:(spent/Math.max(1,d.day))*d.last+planned+unpaidFixed,daily=Math.max(0,remaining)/Math.max(1,d.remainingDays);$("dashboardRemaining").textContent=yen(remaining);let remainingNote="現在の残り予算";if(planned>0&&unpaidFixed>0)remainingNote=`(予定支出 ${yen(planned)}・未払い固定費 ${yen(unpaidFixed)} を差し引き済み)`;else if(planned>0)remainingNote=`(予定支出 ${yen(planned)} を差し引き済み)`;else if(unpaidFixed>0)remainingNote=`(未払い固定費 ${yen(unpaidFixed)} を差し引き済み)`;$("dashboardRemainingNote").textContent=remainingNote;$("dashboardDailyBudget").textContent=`${yen(daily)} / 日`;$("dashboardDailyDays").textContent=`（残り${d.remainingDays}日）`;const displayPct=Math.min(100,pct);$("budgetProgressBar").style.width=displayPct+"%";$("budgetSpentValue").textContent=yen(spent);$("budgetLimitValue").textContent=yen(budget);const spentPos=$("budgetSpentPosition");if(spentPos){spentPos.style.left=displayPct+"%";spentPos.className=`pace-spent-position${displayPct<10?" left-edge":displayPct>90?" right-edge":""}`;}renderPaceTimeline(d.day,d.last);const status=$("dashboardStatus"),label=$("dashboardStatusLabel"),message=$("dashboardStatusMessage");let level="neutral",statusLabel="データ待ち",statusMessage="支出を登録するとペースを判定します。";if(budget<=0){statusLabel="予算未設定";statusMessage="家計ルールを設定すると支出ペースを判定できます。";}else if(spent>budget||projected>budget*1.1){level="danger";statusLabel="使いすぎ";statusMessage=projected>budget?`このペースだと、月末に予算を${yen(projected-budget)}超える見込みです。`:`現在、予算を${yen(spent-budget)}超えています。`;}else if(diff>budget*0.03||projected>budget){level="warning";statusLabel="少し使いすぎ";statusMessage=projected>budget?`このペースだと、月末に予算を${yen(projected-budget)}超える見込みです。`:`今日時点の目安を${yen(diff)}上回っています。`;}else{level="good";statusLabel="順調";statusMessage=spent||planned||unpaidFixed?"今のところ予算内のペースです。":"まだ支出はありません。";}status.className=`budget-status ${level}`;label.textContent=statusLabel;message.textContent=statusMessage;}'
          )

          replace_line(
              app_lines,
              '$("addFixedExpense").onclick=',
              '$("addFixedExpense").onclick=()=>{const amount=Number($("fixedAmount").value);const day=Math.round(Number($("fixedDay").value)||0),category=$("fixedCategory").value;if(!amount||amount<0){alert("金額を入力してください。");return;}if(!category){alert("カテゴリを選択してください。");return;}if(day<1||day>31){alert("支払日は1〜31日で入力してください。");return;}state.fixedExpenses.push({id:Date.now()+Math.random(),amount,category,memo:$("fixedMemo").value.trim(),day,order:Date.now(),paidMonths:[]});$("fixedAmount").value="";save();renderFixedExpenses();calc();};'
          )

          replace_line(
              app_lines,
              '$("saveFixedEdit").onclick=',
              '$("saveFixedEdit").onclick=()=>{const id=$("fixedEditModal").dataset.id,e=state.fixedExpenses.find(x=>String(x.id)===String(id)),amount=Number($("fixedEditAmount").value),day=Math.round(Number($("fixedEditDay").value)||0);if(!e||!amount){alert("金額を入力してください");return;}if(day<1||day>31){alert("支払日は1〜31日で入力してください。");return;}e.amount=amount;e.category=$("fixedEditCategory").value;e.memo=$("fixedEditMemo").value.trim();e.day=day;save();closeFixedEdit();renderFixedExpenses();calc();};'
          )

          app_path.write_text('\n'.join(app_lines) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          if index.count('47.95') != 3:
              raise SystemExit(f'Expected 3 index version refs, found {index.count("47.95")}')
          index = index.replace('47.95', '48.01')
          old_stats = '<div class="stat"><span>今月の予定支出</span><strong id="plannedExpenseView">¥0</strong></div><div class="stat"><span>今月の貯金予定</span>'
          new_stats = '<div class="stat"><span>今月の予定支出</span><strong id="plannedExpenseView">¥0</strong></div><div class="stat"><span>今月の未払い固定費</span><strong id="fixedPendingView">¥0</strong></div><div class="stat"><span>今月の貯金予定</span>'
          if index.count(old_stats) != 1:
              raise SystemExit('Could not locate stats insertion point')
          index = index.replace(old_stats, new_stats, 1)
          index_path.write_text(index, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          if sw.count('47.95') != 3:
              raise SystemExit(f'Expected 3 service-worker version refs, found {sw.count("47.95")}')
          sw_path.write_text(sw.replace('47.95', '48.01'), encoding='utf-8')

          Path('README.md').write_text('''# 家計簿アプリ

## ver.48.01
- 未払い固定費を今月の残り予算に先取りで反映
- 固定費を「支出に確定」した後は未払い固定費の計算対象から外し、実支出のみで計算して二重計上を防止
- 固定費の確定解除時は実支出を戻し、固定費を未払い分として再び予算に反映
- 固定費の新規登録・編集後も残り予算を即時再計算
- 「今月の内訳」に未払い固定費を追加
- 支出ペースの月末予測にも未払い固定費を含める
- index.html / app.js / sw.js / キャッシュ指定 / アプリ下部のバージョンを ver.48.01 に統一
''', encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          node --check app.js
          node --check sw.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          persistent = '\n'.join([app, index, sw, readme])
          assert '47.95' not in persistent
          assert 'const VERSION="48.01";' in app
          assert 'id="fixedPendingView"' in index
          assert 'unpaidFixedAmount=state.fixedExpenses.filter(f=>!fixedPaid(f,key))' in app
          assert 'remaining=spendingBudget-spent-plannedAmount-unpaidFixedAmount' in app
          assert 'projected=(!spent&&!planned&&!unpaidFixed)?0:' in app
          assert '$("fixedPendingView").textContent=yen(n.unpaidFixedAmount)' in app
          assert 'renderFixedExpenses();calc();};' in next(line for line in app.splitlines() if line.startswith('$("addFixedExpense").onclick='))
          assert 'renderFixedExpenses();calc();};' in next(line for line in app.splitlines() if line.startswith('$("saveFixedEdit").onclick='))
          assert 'style.css?v=48.01' in index
          assert 'app.js?v=48.01' in index
          assert 'ver.48.01' in index
          assert 'money-rule-app-v48.01' in sw
          PY

      - name: Remove temporary workflow and verify tree
        shell: bash
        run: |
          rm -f .github/workflows/ver48-01.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          expected = {'README.md','app.js','index.html','manifest.json','style.css','sw.js'}
          actual = {p.name for p in Path('.').iterdir() if p.name != '.git'}
          if actual != expected:
              raise SystemExit(f'Unexpected top-level tree: {sorted(actual)}')
          PY

      - name: Commit validation update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ver.48.01: reserve unpaid fixed expenses in budget"
          git push origin HEAD:develop
