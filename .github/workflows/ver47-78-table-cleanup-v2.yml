name: Ver.47.78 table cleanup v2

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/ver47-78-table-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          OLD='47.77'
          NEW='47.78'

          def must_replace(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'Expected text not found: {label}')
              return text.replace(old, new)

          # index.html
          p=Path('index.html')
          html=p.read_text()
          html=html.replace(OLD,NEW)
          if 'id="deleteFixedEditExpense"' not in html:
              html=must_replace(
                  html,
                  '<div class="modal-actions"><button id="cancelFixedEdit" class="secondary-btn">キャンセル</button><button id="saveFixedEdit">変更を保存</button></div>',
                  '<div class="modal-actions"><button id="deleteFixedEditExpense" type="button" class="edit-modal-delete-btn">削除</button><button id="cancelFixedEdit" class="secondary-btn">キャンセル</button><button id="saveFixedEdit">変更を保存</button></div>',
                  'fixed edit modal actions'
              )
          if 'id="deletePlannedEditExpense"' not in html:
              html=must_replace(
                  html,
                  '<div class="modal-actions"><button id="cancelPlannedEdit" class="secondary-btn">キャンセル</button><button id="savePlannedEdit">変更を保存</button></div>',
                  '<div class="modal-actions"><button id="deletePlannedEditExpense" type="button" class="edit-modal-delete-btn">削除</button><button id="cancelPlannedEdit" class="secondary-btn">キャンセル</button><button id="savePlannedEdit">変更を保存</button></div>',
                  'planned edit modal actions'
              )
          html=html.replace('<p id="deleteConfirmMessage">この支出を削除しますか？</p>','<p id="deleteConfirmMessage">この項目を削除しますか？</p>')
          p.write_text(html)

          # app.js
          p=Path('app.js')
          app=p.read_text()
          app=must_replace(app,'const VERSION="47.77";','const VERSION="47.78";','app version')

          delete_flow='''// Deletion is available only from edit modals.
          let pendingEditDelete=null;
          function setupEditDeleteFlow(){
            const confirmModal=$("deleteConfirmModal");
            const confirmBtn=$("confirmDeleteExpense");
            const cancelBtn=$("cancelDeleteConfirm");
            const closeBtn=$("closeDeleteConfirm");
            const message=$("deleteConfirmMessage");
            if(!confirmModal||!confirmBtn)return;
            const types={
              expense:{buttonId:"deleteEditExpense",modalId:"editModal",items:()=>state.expenses,close:closeEdit,render:renderExpenses,label:"支出"},
              planned:{buttonId:"deletePlannedEditExpense",modalId:"plannedEditModal",items:()=>state.plannedExpenses,close:closePlannedEdit,render:renderPlannedExpenses,label:"予定支出"},
              fixed:{buttonId:"deleteFixedEditExpense",modalId:"fixedEditModal",items:()=>state.fixedExpenses,close:closeFixedEdit,render:renderFixedExpenses,label:"固定費"}
            };
            const closeConfirm=()=>{confirmModal.classList.add("hidden");pendingEditDelete=null;};
            Object.entries(types).forEach(([kind,cfg])=>{
              const button=$(cfg.buttonId);
              if(!button)return;
              button.addEventListener("click",()=>{
                const id=$(cfg.modalId)?.dataset.id;
                const item=cfg.items().find(x=>String(x.id)===String(id));
                if(!item)return;
                pendingEditDelete={kind,id:String(id)};
                if(message){
                  const name=item.memo||item.category||cfg.label;
                  message.textContent=kind==="fixed"
                    ? `${cfg.label}「${name}」 ${yen(item.amount)} を削除しますか？ 過去に確定した支出は削除されません。`
                    : `${cfg.label}「${name}」 ${yen(item.amount)} を削除しますか？`;
                }
                confirmModal.classList.remove("hidden");
              });
            });
            [cancelBtn,closeBtn].forEach(b=>b&&b.addEventListener("click",closeConfirm));
            confirmModal.addEventListener("click",e=>{if(e.target===confirmModal)closeConfirm();});
            confirmBtn.addEventListener("click",()=>{
              if(!pendingEditDelete)return;
              const pending={...pendingEditDelete};
              const cfg=types[pending.kind];
              const items=cfg.items();
              const index=items.findIndex(x=>String(x.id)===pending.id);
              if(index<0){closeConfirm();return;}
              items.splice(index,1);
              save();
              cfg.close();
              closeConfirm();
              cfg.render();
              calc();
            });
          }

          const CATEGORIES='''
          delete_flow=re.sub(r'^          ','',delete_flow,flags=re.M)
          pattern=r'// Expense deletion flow: edit modal -> final confirmation modal -> delete\nfunction setupExpenseDeleteFlow\(\)\{.*?\n\}\n\nconst CATEGORIES='
          app,count=re.subn(pattern,delete_flow,app,count=1,flags=re.S)
          if count!=1:
              raise RuntimeError('Could not replace old delete flow')

          buttons=(
              '<button type="button" class="delete-btn" data-delete="${e.id}">削除</button>',
              '<button type="button" class="delete-btn" data-delete-planned="${e.id}">削除</button>',
              '<button type="button" class="delete-btn" data-delete-fixed="${e.id}">削除</button>'
          )
          for old_button in buttons:
              if old_button not in app:
                  raise RuntimeError(f'List delete button not found: {old_button}')
              app=app.replace(old_button,'')

          fixed_pattern=r'\$\("fixedList"\)\.addEventListener\("click",e=>\{.*?\}\);\n\$\("closeFixedModal"\)'
          fixed_new='$("fixedList").addEventListener("click",e=>{const c=e.target.closest("[data-confirm-fixed]"),u=e.target.closest("[data-unpay-fixed]"),edit=e.target.closest("[data-edit-fixed]");if(c){confirmFixed(c.dataset.confirmFixed);return;}if(u){unpayFixed(u.dataset.unpayFixed);return;}if(edit)openFixedEdit(edit.dataset.editFixed);});\n$("closeFixedModal")'
          app,count=re.subn(fixed_pattern,fixed_new,app,count=1,flags=re.S)
          if count!=1:
              raise RuntimeError('Could not simplify fixed list handler')

          expense_pattern=r'\$\("expenseList"\)\.addEventListener\("click",e=>\{.*?\}\);\n\$\("plannedList"\)'
          expense_new='$("expenseList").addEventListener("click",e=>{const edit=e.target.closest("[data-edit]");if(edit)openEdit(edit.dataset.edit);});\n$("plannedList")'
          app,count=re.subn(expense_pattern,expense_new,app,count=1,flags=re.S)
          if count!=1:
              raise RuntimeError('Could not simplify expense list handler')

          planned_pattern=r'\$\("plannedList"\)\.addEventListener\("click",e=>\{.*?\}\);\n\$\("closeModal"\)'
          planned_new='$("plannedList").addEventListener("click",e=>{const c=e.target.closest("[data-confirm-planned]"),edit=e.target.closest("[data-edit-planned]");if(c){confirmPlanned(c.dataset.confirmPlanned);return;}if(edit)openPlannedEdit(edit.dataset.editPlanned);});\n$("closeModal")'
          app,count=re.subn(planned_pattern,planned_new,app,count=1,flags=re.S)
          if count!=1:
              raise RuntimeError('Could not simplify planned list handler')

          app=must_replace(app,'setupExpenseDeleteFlow();','setupEditDeleteFlow();','delete flow bootstrap')
          p.write_text(app)

          # style.css
          p=Path('style.css')
          css=p.read_text()
          css=css.replace('.delete-btn{margin:0;padding:6px 9px;font-size:12px;background:#eee;color:#333;}\n','')
          css=re.sub(r',(?:\.expense-table|\.planned-expense-table|\.fixed-expense-table) \.delete-btn','',css)
          css=must_replace(css,'padding:10px 8px;border-bottom:1px solid #eee;vertical-align:middle;white-space:nowrap;text-align:left}','padding:6px 6px;border-bottom:1px solid #eee;vertical-align:middle;white-space:nowrap;text-align:left}','desktop table cell padding')
          css=must_replace(css,'min-height:30px;margin:0;padding:5px 7px;font-size:11px;','min-height:24px;margin:0;padding:3px 6px;font-size:10px;','desktop table button height')
          css=must_replace(css,'padding:6px 4px;font-size:10px}','padding:4px 3px;font-size:10px}','mobile table cell padding')
          css=must_replace(css,'font-size:8px;padding:4px 3px;min-height:28px}','font-size:8px;padding:2px 3px;min-height:22px}','mobile table button height')
          if '.edit-modal-delete-btn{' not in css:
              css=must_replace(css,'.secondary-btn{background:#eee;color:#333;}\n','.secondary-btn{background:#eee;color:#333;}\n.edit-modal-delete-btn{margin-right:auto!important;background:#fff0f0;color:#b42318;border:1px solid #efb4b4;}\n.danger-btn{background:#b42318;color:#fff;}\n','modal delete styles')
          p.write_text(css)

          # sw.js
          p=Path('sw.js')
          sw=p.read_text()
          if OLD not in sw:
              raise RuntimeError('Old version not found in sw.js')
          p.write_text(sw.replace(OLD,NEW))
          PY

      - name: Update README
        run: |
          cat > README.md <<'EOF'
          # 家計簿アプリ

          ## ver.47.78
          - 3つの一覧テーブルの行高を詰めて、縦方向をコンパクト化
          - 一覧テーブルから削除ボタンを撤去し、操作列を簡潔化
          - 支出・予定支出・固定費の削除を各編集ウィンドウ内へ統一
          - 削除処理を共通化し、一覧側に残っていた旧削除処理・CSSを削除
          - index.html / app.js / sw.js / キャッシュ指定 / アプリ下部のバージョンを ver.47.78 に統一
          EOF
          sed -i 's/^          //' README.md

      - name: Remove one-time workflow
        run: rm .github/workflows/ver47-78-table-cleanup-v2.yml

      - name: Validate
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          app=Path('app.js').read_text()
          css=Path('style.css').read_text()
          sw=Path('sw.js').read_text()
          readme=Path('README.md').read_text()
          assert 'ver.47.78' in html
          assert 'style.css?v=47.78' in html
          assert 'app.js?v=47.78' in html
          assert 'const VERSION="47.78";' in app
          assert 'money-rule-app-v47.78' in sw
          assert '## ver.47.78' in readme
          assert 'data-delete' not in app
          assert 'delete-btn' not in app
          assert '.delete-btn' not in css
          assert html.count('id="deleteEditExpense"')==1
          assert html.count('id="deletePlannedEditExpense"')==1
          assert html.count('id="deleteFixedEditExpense"')==1
          assert 'setupExpenseDeleteFlow' not in app
          assert 'setupEditDeleteFlow();' in app
          assert 'padding:4px 3px;font-size:10px}' in css
          assert 'min-height:22px' in css
          for path in Path('.').rglob('*'):
              if path.is_file() and '.git' not in path.parts:
                  text=path.read_text(errors='ignore')
                  if '47.77' in text:
                      raise AssertionError(f'Old version remains in {path}')
          PY
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ver.47.78: compact tables and move delete into edit modals"
          git push origin develop
