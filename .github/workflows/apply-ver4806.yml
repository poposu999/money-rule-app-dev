name: Apply ver.48.06

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply ver.48.06
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # app.js
          app = Path('app.js')
          js = app.read_text()
          if 'const VERSION="48.05";' not in js:
              raise SystemExit('app.js version anchor missing')
          js = js.replace('const VERSION="48.05";', 'const VERSION="48.06";', 1)

          replacements = {
            'note=`予定支出 ${yen(n.plannedAmount)}・未払い固定費 ${yen(n.unpaidFixedAmount)} を差し引き済み`': 'note=`（予定支出 ${yen(n.plannedAmount)}・未払い固定費 ${yen(n.unpaidFixedAmount)} を差し引き済み）`',
            'note=`予定支出 ${yen(n.plannedAmount)} を差し引き済み`': 'note=`（予定支出 ${yen(n.plannedAmount)} を差し引き済み）`',
            'note=`未払い固定費 ${yen(n.unpaidFixedAmount)} を差し引き済み`': 'note=`（未払い固定費 ${yen(n.unpaidFixedAmount)} を差し引き済み）`',
          }
          for old, new in replacements.items():
              if old not in js:
                  raise SystemExit(f'app.js note anchor missing: {old}')
              js = js.replace(old, new, 1)
          app.write_text(js)

          # index.html version references
          idx = Path('index.html')
          html = idx.read_text()
          for old, new in [
              ('style.css?v=48.05', 'style.css?v=48.06'),
              ('app.js?v=48.05', 'app.js?v=48.06'),
              ('ver.48.05', 'ver.48.06'),
          ]:
              if old not in html:
                  raise SystemExit(f'index version anchor missing: {old}')
              html = html.replace(old, new)
          idx.write_text(html)

          # style.css
          cssp = Path('style.css')
          css = cssp.read_text()

          def replace_rule(selector, body, required=True):
              global css
              pat = re.compile(re.escape(selector) + r'\{[^{}]*\}')
              repl = selector + '{' + body + '}'
              css2, n = pat.subn(repl, css, count=1)
              if required and n != 1:
                  raise SystemExit(f'CSS rule anchor missing: {selector}')
              css = css2

          # No horizontal scrolling for tables or charts.
          replace_rule('.expense-table-wrap', 'overflow-x:hidden;-webkit-overflow-scrolling:auto')
          replace_rule('.bar-chart-scroll', 'overflow-x:hidden;padding-bottom:4px')
          replace_rule('.vertical-chart', 'width:100%;min-width:0;height:250px;display:flex;flex-direction:column')
          replace_rule('.bar-column', 'flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;cursor:pointer;position:relative')
          replace_rule('.bar-label', 'flex:1;min-width:0;text-align:center;font-size:10px;color:#747c86;white-space:nowrap')

          # Match Today text/triangle to the amount/triangle above the meter.
          if '.today-label strong{' in css:
              replace_rule('.today-label strong', 'font-size:13px;line-height:1.1')
          else:
              anchor = '.today-label{position:absolute;top:0;left:0;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);color:#30343a;white-space:nowrap;transition:left .25s}'
              if anchor not in css:
                  raise SystemExit('today-label anchor missing')
              css = css.replace(anchor, anchor + '.today-label span{font-size:10px;line-height:1}.today-label strong{font-size:13px;line-height:1.1}', 1)

          # Mobile: keep everything inside viewport and use the same 12px/9px rhythm as the amount marker.
          mobile = '''\n@media(max-width:680px){
  .today-label strong{font-size:12px;line-height:1.1}
  .today-label span{font-size:9px;line-height:1}
  .vertical-bars{gap:2px;padding-left:2px;padding-right:2px}
  .bar-labels{gap:2px;padding-left:2px;padding-right:2px}
  .bar-column,.bar-label{min-width:0}
  .expense-table-wrap,.bar-chart-scroll{overflow-x:hidden}
}\n'''
          marker = '@media (prefers-color-scheme: dark){'
          if marker in css:
              css = css.replace(marker, mobile + marker, 1)
          else:
              css = css.rstrip() + mobile
          cssp.write_text(css)

          # README must describe only this version's changes.
          Path('README.md').write_text('''# 家計簿アプリ\n\n## ver.48.06\n- 残り予算の予定支出・未払い固定費の補足を括弧書きへ変更\n- 支出ペースの「▲ Today」を上側の金額表示と同じサイズ感へ調整\n- 支出・予定支出・固定費テーブルの横スクロールを廃止し、操作ボタンまで画面内に表示\n- 日別・月別グラフの横スクロールを廃止し、画面幅内に収まる表示へ変更\n''')
          PY

          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          js=Path('app.js').read_text()
          html=Path('index.html').read_text()
          css=Path('style.css').read_text()
          rd=Path('README.md').read_text()
          checks = [
              ('version js', 'const VERSION="48.06";' in js),
              ('version css query', 'style.css?v=48.06' in html),
              ('version js query', 'app.js?v=48.06' in html),
              ('version footer', 'ver.48.06' in html),
              ('readme', '## ver.48.06' in rd),
              ('note both', '（予定支出 ${yen(n.plannedAmount)}・未払い固定費 ${yen(n.unpaidFixedAmount)} を差し引き済み）' in js),
              ('note planned', '（予定支出 ${yen(n.plannedAmount)} を差し引き済み）' in js),
              ('note fixed', '（未払い固定費 ${yen(n.unpaidFixedAmount)} を差し引き済み）' in js),
              ('table no horizontal scroll', '.expense-table-wrap{overflow-x:hidden' in css),
              ('chart no horizontal scroll', '.bar-chart-scroll{overflow-x:hidden' in css),
              ('chart no min width', '.vertical-chart{width:100%;min-width:0' in css),
              ('today desktop', '.today-label strong{font-size:13px;line-height:1.1}' in css),
              ('today mobile', '.today-label strong{font-size:12px;line-height:1.1}' in css),
          ]
          bad=[name for name,ok in checks if not ok]
          if bad: raise SystemExit('validation failed: '+', '.join(bad))
          if 'min-width:640px' in css: raise SystemExit('stale graph min-width remains')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github
          git add README.md app.js index.html style.css .github || true
          git commit -m 'Update ver.48.06 no-scroll layout'
          git push origin develop
