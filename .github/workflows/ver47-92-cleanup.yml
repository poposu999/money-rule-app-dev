name: Ver.47.92 cleanup

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/ver47-92-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .ver47_92_cleanup.py
      - name: Validate JavaScript and diff
        run: |
          node --check app.js
          node --check sw.js
          git diff --check
      - name: Validate cleanup targets
        run: |
          ! grep -R -nE 'console\.(log|debug)' README.md app.js index.html manifest.json style.css sw.js
          ! grep -R -n '47\.91' README.md app.js index.html manifest.json style.css sw.js
          ! grep -nE '\.(today-budget|dashboard-grid|spending-status|breakdown-row|highlight-row|budget-breakdown|forecast-main|quick-entry|section-controls|section-hidden|stat-toggle-btn|validation-ok)' style.css
          ! grep -n 'stat-toggle-btn' app.js index.html
      - name: Remove temporary automation files
        run: |
          rm -f .ver47_92_cleanup.py .github/workflows/ver47-92-cleanup.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Validate final tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected={'README.md','app.js','index.html','manifest.json','style.css','sw.js'}
          actual={p.name for p in Path('.').iterdir() if p.name != '.git'}
          if actual != expected:
              raise SystemExit(f'final top-level tree mismatch: {sorted(actual)}')
          PY
          node --check app.js
          node --check sw.js
          git diff --check
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ver.47.92: clean obsolete code and storage access'
          git push origin develop
