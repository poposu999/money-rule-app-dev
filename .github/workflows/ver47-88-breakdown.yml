name: Ver.47.88 breakdown cleanup

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/ver47-88-breakdown.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply update
        run: python3 .ver47_88_update.py
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check sw.js
          git diff --check
      - name: Commit final state
        run: |
          rm -f .ver47_88_update.py
          rm -f .github/workflows/ver47-88-breakdown.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ver.47.88: simplify monthly breakdown"
          git push origin develop
