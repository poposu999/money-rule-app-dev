name: Fix Ver.48.12 workflow escape

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/fix-ver4812-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Fix escape and clean helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ver4812-ui-polish.yml')
          s=p.read_text(encoding='utf-8')
          old='保存されていない変更があります。\\n入力内容を破棄して月を移動しますか？'
          new='保存されていない変更があります。\\\\n入力内容を破棄して月を移動しますか？'
          if old not in s:
              raise SystemExit('target escape not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm -f .github/workflows/fix-ver4812-workflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix ver.48.12 workflow escape'
          git push origin develop
