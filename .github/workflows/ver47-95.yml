name: Ver.47.95 update

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/ver47-95.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply update
        run: python3 .ver47_95_update.py
      - name: Validate JavaScript and diff
        run: |
          node --check app.js
          node --check sw.js
          git diff --check
      - name: Validate Today class fix
        run: |
          ! grep -n 'getToday()-label' app.js
          grep -n 'todayLabel.className=`today-label' app.js
          grep -n '\.today-label{' style.css
          ! grep -R -n '47\.94' README.md app.js index.html manifest.json style.css sw.js
          grep -n 'const VERSION="47.95"' app.js
          grep -n 'money-rule-app-v47.95' sw.js
      - name: Remove temporary automation files
        run: |
          rm -f .ver47_95_update.py .github/workflows/ver47-95.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Validate final tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected={'README.md','app.js','index.html','manifest.json','style.css','sw.js'}
          actual={p.name for p in Path('.').iterdir() if p.name != '.git'}
          if actual != expected:
              raise SystemExit(f'final top-level tree mismatch: {sorted(actual)}')
          PY
          node --check app.js
          node --check sw.js
          git diff --check
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ver.47.95: fix Today marker class'
          git push origin develop
