name: Ver.47.85 dashboard refinement
on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/ver47-85-dashboard.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply dashboard changes
        run: python3 .ver47_85_update.py
      - name: Validate and commit
        shell: bash
        run: |
          node --check app.js
          node --check sw.js
          grep -q 'style.css?v=47.85' index.html
          grep -q 'app.js?v=47.85' index.html
          grep -q 'ver.47.85' index.html
          grep -q 'const VERSION="47.85"' app.js
          grep -q 'money-rule-app-v47.85' sw.js
          grep -q 'dashboardDailyBudget' index.html
          grep -q '目安より' index.html
          grep -q '今のペースの場合' index.html
          grep -q '0日 / 10日 / 20日 / 月末' README.md
          ! grep -q 'budget-meter-row' index.html
          ! grep -q 'progress-timeline-line' index.html
          ! grep -q 'budget-meter-row' style.css
          ! grep -q 'progress-timeline-line' style.css
          ! grep -R '47.84' README.md index.html app.js style.css sw.js
          git diff --check
          rm -f .ver47_85_update.py .github/workflows/ver47-85-dashboard.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "README.md app.js index.html manifest.json style.css sw.js "
          test ! -d .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ver.47.85: unify budget pace meter and clarify dashboard'
          git push origin develop
