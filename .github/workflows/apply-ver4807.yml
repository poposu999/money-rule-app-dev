name: Apply ver.48.07

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply ver.48.07
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # app.js
          app = Path('app.js')
          js = app.read_text()
          if 'const VERSION="48.06";' not in js:
              raise SystemExit('app.js version anchor missing')
          js = js.replace('const VERSION="48.06";', 'const VERSION="48.07";', 1)
          app.write_text(js)

          # index.html
          idx = Path('index.html')
          html = idx.read_text()
          for old, new in [
              ('style.css?v=48.06', 'style.css?v=48.07'),
              ('app.js?v=48.06', 'app.js?v=48.07'),
              ('ver.48.06', 'ver.48.07'),
          ]:
              if old not in html:
                  raise SystemExit(f'index version anchor missing: {old}')
              html = html.replace(old, new)
          idx.write_text(html)

          # style.css
          cssp = Path('style.css')
          css = cssp.read_text()

          # Base form sizing: prevent iOS date inputs and grid children from exceeding their column.
          css = css.replace(
              '.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}',
              '.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0;max-width:100%}'
          )
          css = css.replace(
              'label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#49515c;margin:0 0 11px}',
              'label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#49515c;margin:0 0 11px;min-width:0;max-width:100%}'
          )
          css = css.replace(
              'input,select{width:100%;height:42px;border:1px solid #cfd4da;border-radius:9px;background:#fff;color:#1e2329;padding:7px 10px;font:inherit;font-size:15px}',
              'input,select{width:100%;min-width:0;max-width:100%;height:42px;border:1px solid #cfd4da;border-radius:9px;background:#fff;color:#1e2329;padding:7px 10px;font:inherit;font-size:15px}'
          )
          if 'input[type="date"]{' not in css:
              css = css.replace(
                  'input:focus,select:focus{',
                  'input[type="date"]{display:block;width:100%;min-width:0;max-width:100%;overflow:hidden}input:focus,select:focus{',
                  1
              )

          # Table: fit to parent width, keep action buttons horizontal, never rely on a large min-width.
          css = css.replace(
              '.expense-table-wrap{overflow-x:hidden;-webkit-overflow-scrolling:auto}',
              '.expense-table-wrap{width:100%;min-width:0;max-width:100%;overflow-x:visible}'
          )
          css = css.replace(
              '.expense-table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:0}',
              '.expense-table{width:100%;min-width:0;max-width:100%;border-collapse:collapse;table-layout:fixed}'
          )
          css = css.replace(
              '.expense-table th,.expense-table td{padding:5px 7px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:middle;font-size:12px;line-height:1.35}',
              '.expense-table th,.expense-table td{min-width:0;max-width:100%;overflow:hidden;padding:5px 7px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:middle;font-size:12px;line-height:1.35}'
          )
          css = css.replace(
              '.table-actions{display:flex;justify-content:flex-end;align-items:center;gap:5px;flex-wrap:nowrap}',
              '.table-actions{display:flex;justify-content:flex-end;align-items:center;gap:3px;flex-wrap:nowrap;width:100%;min-width:0;max-width:100%}'
          )
          css = css.replace(
              '.table-actions button{padding:5px 7px;font-size:10px;white-space:nowrap}',
              '.table-actions button{padding:3px 4px;font-size:9px;min-width:0;white-space:nowrap}'
          )

          # Graphs: force all containers and internal plots to the actual card width.
          css = css.replace(
              '.charts{position:relative}',
              '.charts{position:relative;min-width:0;max-width:100%}'
          )
          css = css.replace(
              '.chart-card{box-shadow:none;background:#fafbfc;margin:12px 0 0;padding:14px}',
              '.chart-card{box-shadow:none;background:#fafbfc;margin:12px 0 0;padding:14px;min-width:0;max-width:100%;overflow:hidden}'
          )
          css = css.replace(
              '.bar-chart-scroll{overflow-x:hidden;padding-bottom:4px}',
              '.bar-chart-scroll{width:100%;min-width:0;max-width:100%;overflow-x:visible;padding-bottom:4px}'
          )
          css = css.replace(
              '.vertical-chart{width:100%;min-width:0;height:250px;display:flex;flex-direction:column}',
              '.vertical-chart{width:100%;min-width:0;max-width:100%;height:250px;display:flex;flex-direction:column;overflow:hidden}'
          )
          css = css.replace(
              '.vertical-bars{height:210px;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid #cfd4da;padding:0 8px}',
              '.vertical-bars{width:100%;min-width:0;max-width:100%;height:210px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid #cfd4da;padding:0 4px}'
          )
          css = css.replace(
              '.bar-labels{height:36px;display:flex;gap:5px;padding:5px 8px 0}',
              '.bar-labels{width:100%;min-width:0;max-width:100%;height:36px;display:flex;gap:3px;padding:5px 4px 0}'
          )

          # Remove stale mobile min-width rules that were causing the right side to be clipped.
          css = css.replace('.expense-table{min-width:620px}', '.expense-table{width:100%;min-width:0;max-width:100%}')
          css = css.replace('.vertical-chart{min-width:580px}', '.vertical-chart{width:100%;min-width:0;max-width:100%}')

          # Tight mobile fit while preserving horizontal action buttons.
          css = css.replace(
              '.table-actions button{padding:1px 3px;font-size:8px;min-height:18px;line-height:1.1;white-space:nowrap}',
              '.table-actions button{padding:1px 2px;font-size:7.5px;min-width:0;min-height:18px;line-height:1.05;white-space:nowrap}'
          )
          css = css.replace(
              '.table-actions{display:flex;justify-content:flex-end;align-items:center;gap:4px;flex-wrap:nowrap}',
              '.table-actions{display:flex;justify-content:flex-end;align-items:center;gap:2px;flex-wrap:nowrap;width:100%;min-width:0;max-width:100%}'
          )
          css = css.replace(
              '.category-bar-row{grid-template-columns:86px 1fr 60px}',
              '.category-bar-row{grid-template-columns:minmax(58px,76px) minmax(0,1fr) minmax(48px,56px);gap:5px;min-width:0;max-width:100%}'
          )

          # Strengthen the second mobile block added in ver.48.06.
          css = css.replace(
              '  .vertical-bars{gap:2px;padding-left:2px;padding-right:2px}\n  .bar-labels{gap:2px;padding-left:2px;padding-right:2px}\n  .bar-column,.bar-label{min-width:0}\n  .expense-table-wrap,.bar-chart-scroll{overflow-x:hidden}\n',
              '  .vertical-bars{width:100%;max-width:100%;gap:1px;padding-left:1px;padding-right:1px}\n  .bar-labels{width:100%;max-width:100%;gap:1px;padding-left:1px;padding-right:1px}\n  .bar-column,.bar-label{min-width:0}\n  .expense-table-wrap,.bar-chart-scroll{width:100%;max-width:100%;overflow-x:visible}\n  .expense-table,.vertical-chart{width:100%;min-width:0;max-width:100%}\n  .grid>*{min-width:0;max-width:100%}\n  input[type="date"]{width:100%;min-width:0;max-width:100%}\n'
          )

          cssp.write_text(css)

          Path('README.md').write_text('''# 家計簿アプリ\n\n## ver.48.07\n- スマホでテーブル右端が見切れる問題を修正し、操作ボタンは横並びのまま画面幅内に収まるよう調整\n- 日別・月別・カテゴリ別グラフを実際の表示領域100%以内に収め、右端の見切れを修正\n- 支出・予定支出入力の日付欄がiPhoneで枠外にはみ出す問題を修正\n- 横スクロール前提の古いスマホ用 min-width 指定を削除\n''')
          PY

          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('app.js').read_text()
          html=Path('index.html').read_text()
          css=Path('style.css').read_text()
          rd=Path('README.md').read_text()
          checks=[
              ('version js','const VERSION="48.07";' in js),
              ('css query','style.css?v=48.07' in html),
              ('js query','app.js?v=48.07' in html),
              ('footer','ver.48.07' in html),
              ('readme','## ver.48.07' in rd),
              ('no table 620','min-width:620px' not in css),
              ('no chart 580','min-width:580px' not in css),
              ('date width','input[type="date"]{display:block;width:100%;min-width:0;max-width:100%;overflow:hidden}' in css),
              ('table width','.expense-table{width:100%;min-width:0;max-width:100%' in css),
              ('chart width','.vertical-chart{width:100%;min-width:0;max-width:100%' in css),
              ('horizontal actions','flex-wrap:nowrap' in css and '.table-actions button{padding:1px 2px;font-size:7.5px' in css),
          ]
          bad=[name for name,ok in checks if not ok]
          if bad: raise SystemExit('validation failed: '+', '.join(bad))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github
          git add README.md app.js index.html style.css .github || true
          git commit -m 'Update ver.48.07 responsive fit'
          git push origin develop
