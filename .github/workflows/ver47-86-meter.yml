name: Ver.47.86 pace meter update

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/ver47-86-meter.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply update
        run: python3 .github/ver47_86_update.py
      - name: Validate and publish
        shell: bash
        run: |
          node --check app.js
          node --check sw.js
          grep -q 'style.css?v=47.86' index.html
          grep -q 'app.js?v=47.86' index.html
          grep -q 'ver.47.86' index.html
          grep -q 'const VERSION="47.86"' app.js
          grep -q 'money-rule-app-v47.86' sw.js
          grep -q 'monthProgressBar' index.html
          grep -q 'paceComparison' index.html
          ! grep -q 'budget-combined-meter' index.html
          ! grep -q 'progressTodayMarker' index.html
          ! grep -q 'progress-today-marker' style.css
          ! grep -q 'progress-today-label' style.css
          ! grep -R '47.85' README.md index.html app.js style.css sw.js
          git diff --check
          git rm .github/workflows/ver47-86-meter.yml .github/ver47_86_update.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "README.md app.js index.html manifest.json style.css sw.js "
          test ! -d .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ver.47.86: clarify spending pace comparison'
          git push origin develop
