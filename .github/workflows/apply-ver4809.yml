name: Apply ver.48.09

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-ver4809.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Apply ver.48.09
        shell: bash
        run: |
          python3 .github/apply4809.py
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          assert 'const VERSION="48.09";' in app
          assert 'style.css?v=48.09' in idx and 'app.js?v=48.09' in idx and 'ver.48.09' in idx
          assert '## ver.48.09' in readme
          assert '48.08' not in app and '48.08' not in idx and '48.08' not in css and '48.08' not in readme
          assert 'validateV49BackupRaw' in app
          assert 'plannedLegacyMap' in app and 'pendingPlannedMap' not in app
          assert 'window.setInterval(refreshDateContext,60000);' in app
          assert '予定支出との相互リンクが不整合です' in app
          assert '固定費との相互リンクが不整合です' in app
          assert '過去月の予算は未計算' in app
          PY

      - name: Browser logic smoke tests
        shell: bash
        run: |
          npm install jsdom@26 --no-save --no-package-lock >/dev/null 2>&1
          node .github/test4809.js

      - name: Commit ver.48.09
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html style.css README.md
          git rm .github/apply4809.py .github/test4809.js .github/workflows/apply-ver4809.yml
          git commit -m 'Fix ver.48.09 validation and rollover logic'
          git push origin develop
