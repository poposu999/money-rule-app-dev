name: Ver.47.90 pace labels

on:
  push:
    branches: [develop]
    paths:
      - '.ver47_90_update.py'
      - '.github/workflows/ver47-90-pace.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply Ver.47.90 update
        run: python .ver47_90_update.py
      - name: Validate code and diff
        run: |
          node --check app.js
          node --check sw.js
          git diff --check
          ! grep -R "47.89" README.md app.js index.html style.css sw.js manifest.json
          grep -q 'id="budgetSpentPosition"' index.html
          grep -q '>Today<' index.html
          ! grep -q 'todayMarker\|today-marker' index.html app.js style.css
      - name: Remove temporary updater and workflow
        run: |
          rm -f .ver47_90_update.py
          rm -rf .github
      - name: Validate final repository shape
        run: |
          actual="$(find . -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected="$(printf '%s\n' README.md app.js index.html manifest.json style.css sw.js | sort)"
          test "$actual" = "$expected"
          test ! -e .github
          git diff --check
      - name: Commit Ver.47.90
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ver.47.90: align pace labels with meter"
          git push origin HEAD:develop
