name: Apply ver.48.05

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply ver.48.05
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Version
          app = Path('app.js')
          js = app.read_text()
          old = 'const VERSION="48.04";'
          if old not in js:
              raise SystemExit('app.js version anchor missing')
          js = js.replace(old, 'const VERSION="48.05";', 1)
          app.write_text(js)

          # HTML version references + automatic system color-scheme metadata
          idx = Path('index.html')
          html = idx.read_text()
          html = html.replace('style.css?v=48.04', 'style.css?v=48.05')
          html = html.replace('app.js?v=48.04', 'app.js?v=48.05')
          html = html.replace('ver.48.04', 'ver.48.05')
          old_theme = '<meta name="theme-color" content="#ffffff"/>'
          new_theme = '<meta name="color-scheme" content="light dark"/>\n<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>\n<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)"/>'
          if old_theme in html:
              html = html.replace(old_theme, new_theme, 1)
          elif 'name="color-scheme"' not in html:
              raise SystemExit('theme-color anchor missing')
          idx.write_text(html)

          # CSS helpers
          css_path = Path('style.css')
          css = css_path.read_text()

          def set_rule(text, selector, body, require=False):
              pat = re.compile(re.escape(selector) + r'\{[^{}]*\}')
              repl = selector + '{' + body + '}'
              out, n = pat.subn(repl, text, count=1)
              if require and n != 1:
                  raise SystemExit(f'CSS rule anchor missing: {selector}')
              if n == 0:
                  pos = out.find('@media(max-width:680px)')
                  if pos < 0:
                      pos = len(out)
                  out = out[:pos] + repl + out[pos:]
              return out

          def media_block(text, marker):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'media block missing: {marker}')
              brace = text.find('{', start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return start, brace, i
              raise SystemExit('unbalanced media block')

          def set_inner_rule(inner, selector, body):
              pat = re.compile(re.escape(selector) + r'\{[^{}]*\}')
              repl = selector + '{' + body + '}'
              out, n = pat.subn(repl, inner, count=1)
              if n == 0:
                  out += repl
              return out

          # Income visibility: JS already toggles this class; restore the missing CSS behavior.
          if '.stat-hidden{display:none!important}' not in css:
              anchor = '.section-body-hidden{display:none!important}'
              if anchor not in css:
                  raise SystemExit('section hidden CSS anchor missing')
              css = css.replace(anchor, anchor + '.stat-hidden{display:none!important}', 1)

          # Tables: keep current proportions, remove forced desktop-width overflow.
          css = set_rule(css, '.expense-table', 'width:100%;border-collapse:collapse;table-layout:fixed;min-width:0', require=True)

          # Budget dashboard: keep Ver.49 logic/text, restore the clearer Ver.48 visual hierarchy.
          budget_rules = {
            '.budget-dashboard':'text-align:center;padding:18px',
            '.budget-dashboard-title':'text-align:left;margin-bottom:6px',
            '.budget-dashboard-title h2':'font-size:15px;color:#4b5563',
            '.budget-hero':'display:flex;align-items:baseline;justify-content:center;gap:9px;padding:9px 0 2px;text-align:center',
            '.budget-hero-prefix,.budget-hero-suffix':'font-size:16px;font-weight:700;color:#374151;white-space:nowrap',
            '.budget-hero strong':'font-size:44px;line-height:1.05;letter-spacing:-1.5px',
            '.budget-hero-note':'display:block;text-align:center;margin-top:4px;font-size:11px;color:#6b7280;min-height:18px',
            '.budget-daily-guide':'display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin:12px 0;padding:9px 11px;border-radius:10px;background:#f7f8fa;color:#6b7280;font-size:11px',
            '.budget-daily-guide span,.budget-daily-guide small':'color:inherit',
            '.budget-daily-guide strong':'text-align:right;color:#202124;font-size:15px',
            '.pace-compare':'margin-top:6px;padding:12px;border:1px solid #e5e7eb;border-radius:12px;background:#fff',
            '.pace-unified':'min-width:0',
            '.pace-summary-line':'display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:2px;font-size:11px;color:#6b7280',
            '.pace-spent-row':'position:relative;height:31px',
            '.pace-spent-position':'position:absolute;top:0;left:0;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);white-space:nowrap;transition:left .25s',
            '.pace-spent-position.left-edge':'transform:none;align-items:flex-start',
            '.pace-spent-position.right-edge':'transform:translateX(-100%);align-items:flex-end',
            '.pace-spent-position strong':'font-size:13px;line-height:1.1;color:#202124',
            '.pace-spent-arrow':'margin-top:2px;font-size:10px;line-height:1;color:#30343a',
            '.pace-track-wrap':'position:relative',
            '.pace-bar':'height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;position:relative;width:100%',
            '.pace-bar>div':'height:100%;width:0;background:#30343a;border-radius:999px;transition:width .25s',
            '.pace-scale':'position:relative;height:48px;margin-top:2px',
            '.today-label':'position:absolute;top:0;left:0;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);color:#30343a;white-space:nowrap;transition:left .25s',
            '.today-label.left-edge':'transform:none;align-items:flex-start',
            '.today-label.right-edge':'transform:translateX(-100%);align-items:flex-end',
            '.progress-timeline-labels':'position:absolute;left:0;right:0;bottom:0;height:16px;font-size:9px;color:#8a8f98',
            '.timeline-label':'position:absolute;top:3px;transform:translateX(-50%);font-size:10px;color:#858c95;white-space:nowrap',
            '.budget-status':'display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;margin-top:10px;padding:11px 12px;border-radius:11px',
            '.budget-status.good':'background:#eef7ee;color:#18794e',
            '.budget-status.warning':'background:#fff7e6;color:#8a5a00',
            '.budget-status.danger':'background:#fff0f0;color:#b42318',
            '.budget-status strong':'font-size:14px;white-space:nowrap',
            '.budget-status span':'font-size:11px;line-height:1.45'
          }
          for sel, body in budget_rules.items():
              css = set_rule(css, sel, body, require=(sel != '.budget-dashboard-title h2'))
          css = set_rule(css, '.budget-status.neutral', 'background:#f3f4f6;color:#4b5563')

          # Responsive budget/table rules in the existing mobile media block.
          ms, mb, me = media_block(css, '@media(max-width:680px)')
          inner = css[mb+1:me]
          mobile_rules = {
            '.budget-dashboard':'padding:15px 12px',
            '.budget-hero':'gap:6px',
            '.budget-hero-prefix,.budget-hero-suffix':'font-size:14px',
            '.budget-hero strong':'font-size:36px;letter-spacing:-1px',
            '.budget-daily-guide':'grid-template-columns:auto 1fr;padding:8px 9px;gap:4px 8px',
            '.budget-daily-guide strong':'font-size:14px',
            '.budget-daily-guide small':'grid-column:2;text-align:right;font-size:9px',
            '.pace-compare':'padding:10px 9px',
            '.pace-summary-line':'gap:6px;font-size:10px',
            '.pace-limit strong':'font-size:11px',
            '.pace-spent-row':'height:29px',
            '.pace-spent-position strong':'font-size:12px',
            '.pace-spent-arrow':'font-size:9px',
            '.pace-bar':'height:11px',
            '.budget-status':'gap:7px;padding:10px',
            '.budget-status strong':'font-size:13px',
            '.budget-status span':'font-size:10px',
            '.expense-table th,.expense-table td':'padding:1px 3px;font-size:10px;line-height:1.1',
            '.table-actions':'display:flex;justify-content:flex-end;align-items:center;gap:4px;flex-wrap:nowrap',
            '.table-actions button':'padding:1px 3px;font-size:8px;min-height:18px;line-height:1.1;white-space:nowrap'
          }
          for sel, body in mobile_rules.items():
              inner = set_inner_rule(inner, sel, body)
          css = css[:mb+1] + inner + css[me:]

          # Automatic OS dark mode. No app-side switch; follows prefers-color-scheme live.
          dark = r'''
@media (prefers-color-scheme: dark){
html{color-scheme:dark;background:#111418;color:#e8ebef}
body{background:#111418;color:#e8ebef}
.dev-environment-banner{background:#090b0e;color:#f4f6f8;box-shadow:0 1px 8px rgba(0,0,0,.45)}
.card,.month-shell,.modal-box{background:#181c21;border-color:#303640;box-shadow:0 2px 9px rgba(0,0,0,.22)}
.section-title h2,.chart-card h2,.entry-panel-heading,.stats .stat strong,.budget-hero strong{color:#eef1f4}
.month-nav-arrow,.month-nav-current,.minus-btn,.close-btn,.secondary-btn,.year-btn,.month-choice{background:#20252b;color:#e8ebef;border-color:#414852}
.month-nav-caret,.year-btn small,.month-choice small,.muted,.expense-empty,.app-footer,.chart-legend,.bar-label,.category-bar-label,.budget-hero-note,.stats .stat span{color:#aab2bc}
input,select{background:#20252b;color:#f2f4f7;border-color:#454c55}
input::placeholder{color:#7f8893}
input:focus,select:focus{border-color:#818b97;outline-color:rgba(180,190,202,.22)}
.entry-tab{background:#20252b;color:#b7bec7;border-color:#343a43}
.entry-tab.active{background:#e1e5ea;color:#171a1e;border-color:#e1e5ea}
.category-quick button{background:#20252b;color:#c6ccd3;border-color:#343a43}
.category-quick button.selected{background:#e1e5ea;color:#171a1e;border-color:#e1e5ea}
.expense-table th{background:#20252b;color:#b5bdc7}
.expense-table th,.expense-table td,.stats .stat{border-color:#303640}
.edit-btn{background:#20252b;color:#e3e7eb;border-color:#454c55}
.confirm-btn{background:#4a535f;color:#fff}
.fixed-paid{background:#293039;color:#d5dbe2;border-color:#454c55}
.chart-card{background:#20252b}
.category-bar-track,.pace-bar{background:#303640}
.stack-actual,.pace-bar>div{background:#b8c0ca}
.stack-planned{background:#7e8792}
.stack-fixed{background:#555e68}
.vertical-bars{border-color:#4a515a}
.chart-popup,.memo-popup{background:#07090b;color:#fff}
.pace-compare{background:#181c21;border-color:#303640}
.budget-dashboard-title h2,.budget-hero-prefix,.budget-hero-suffix,.budget-daily-guide strong,.pace-spent-position strong,.today-label{color:#e8ebef}
.budget-daily-guide{background:#20252b;color:#aab2bc}
.pace-summary-line,.progress-timeline-labels,.timeline-label{color:#aab2bc}
.pace-spent-arrow{color:#c7ced6}
.budget-status.good{background:#163124;color:#85d8a7}
.budget-status.warning{background:#362c16;color:#e6c36a}
.budget-status.danger{background:#3a2022;color:#f0a0a5}
.budget-status.neutral{background:#252b32;color:#c0c7d0}
.month-context-warning,.inline-warning,.validation-warning{background:#352d18;border-color:#66582d;color:#e5ca7c}
.danger-btn,.edit-modal-delete-btn{background:#3a2022;color:#f2a4a9;border-color:#704045}
.integrity-result{border-color:#424a54}
.integrity-result.good{background:#183024;border-color:#315b42;color:#b9e2c6}
.integrity-result.bad,.migration-error-item{background:#382124;border-color:#6c4146;color:#f1b0b5}
.year-list{border-color:#343a43}
.year-btn.active,.month-choice.active{background:#2b323a;border-color:#65707d}
.month-marker{background:#303640;color:#c3cad2}
.month-marker.warn{background:#493a17;color:#ecd47e}
.month-marker.current{background:#263544;color:#b7d1e9}
.month-marker.noincome{background:#44292b;color:#e8aeb2}
hr,.split-actions{border-color:#303640}
}
'''
          css = re.sub(r'\n?@media \(prefers-color-scheme: dark\)\{.*\}\s*$', '', css, flags=re.S)
          css = css.rstrip() + '\n' + dark.strip() + '\n'
          css_path.write_text(css)

          Path('README.md').write_text('''# 家計簿アプリ\n\n## ver.48.05\n- 支出・予定支出・固定費テーブルをスマホ幅に収め、右端の操作ボタンを表示\n- 端末のライト/ダーク設定へ自動追従するダークモードを追加\n- Ver.49の計算・文言は維持したまま「今月の予算」の視認性をVer.48基準へ調整\n- 「前月の収入を非表示」で前月収入と超過分が正しく非表示・再表示されるよう修正\n''')
          PY

          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          js=Path('app.js').read_text(); h=Path('index.html').read_text(); css=Path('style.css').read_text(); rd=Path('README.md').read_text()
          if 'const VERSION="48.05";' not in js: raise SystemExit('VERSION not 48.05')
          for token in ['style.css?v=48.05','app.js?v=48.05','ver.48.05','name="color-scheme"']:
              if token not in h: raise SystemExit(f'index token missing: {token}')
          if '48.04' in js or '48.04' in h or '48.04' in rd: raise SystemExit('stale 48.04 version reference')
          if 'min-width:650px' in css: raise SystemExit('table forced width remains')
          if '.stat-hidden{display:none!important}' not in css: raise SystemExit('stat hidden CSS missing')
          if '@media (prefers-color-scheme: dark)' not in css: raise SystemExit('dark mode media missing')
          if '.budget-hero strong{font-size:44px' not in css: raise SystemExit('budget hero desktop size missing')
          if css.count('{') != css.count('}'): raise SystemExit('CSS braces unbalanced')
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit(f'duplicate HTML ids: {dup}')
          refs=set(re.findall(r'\$\("([A-Za-z0-9_-]+)"\)',js))
          missing=sorted(refs-set(ids))
          if missing: raise SystemExit(f'missing HTML ids referenced by $(): {missing}')
          PY

          rm -f .github/workflows/apply-ver4805.yml
          rmdir .github/workflows .github 2>/dev/null || true
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          test ! -d .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update ver.48.05 UI and dark mode"
          git push origin HEAD:develop
