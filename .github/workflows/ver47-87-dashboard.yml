name: Ver.47.87 dashboard cleanup

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/ver47-87-dashboard.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply update
        run: python3 .ver47_87_update.py
      - name: Validate
        run: |
          node --check app.js
          node --check sw.js
          git diff --check
          test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "README.md app.js index.html manifest.json style.css sw.js " || {
            echo "Unexpected top-level files before cleanup check"
            find . -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          }
      - name: Commit final state
        run: |
          rm -f .ver47_87_update.py
          rm -f .github/workflows/ver47-87-dashboard.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          node --check app.js
          node --check sw.js
          git diff --check
          test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "README.md app.js index.html manifest.json style.css sw.js "
          test ! -e .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ver.47.87: simplify budget dashboard"
          git push origin develop
