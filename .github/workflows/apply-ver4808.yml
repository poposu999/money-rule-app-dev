name: Apply ver.48.08

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/apply-ver4808.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Apply patch
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode('ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCgpwID0gUGF0aCgiYXBwLmpzIikKcyA9IHAucmVhZF90ZXh0KGVuY29kaW5nPSJ1dGYtOCIpCm9sZCA9ICdjb25zdCBWRVJTSU9OPS '))"
          node --check app.js
          grep -q 'const VERSION="48.08";' app.js
          grep -q 'style.css?v=48.08' index.html
          grep -q 'app.js?v=48.08' index.html
          grep -q 'ver.48.08' index.html
          grep -q '## ver.48.08' README.md
          grep -q -- '-webkit-appearance:none' style.css
          grep -q -- '::-webkit-date-and-time-value' style.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html style.css README.md
          git rm .github/workflows/apply-ver4808.yml
          git commit -m 'Fix ver.48.08 iOS date input layout'
          git push origin develop
