name: One-time mobile date fix
on:
  push:
    branches:
      - update
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy workflow
        run: sleep 20
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Fix mobile date cells
        run: |
          if ! grep -q 'ver.47.8: mobile date cells' style.css; then
            cat >> style.css <<'EOF'

/* ver.47.8: mobile date cells must always show MM/DD */
@media(max-width:600px){.expense-table th:nth-child(1),.expense-table td:nth-child(1){width:58px!important;min-width:58px!important;max-width:58px!important;white-space:nowrap!important;overflow:visible!important;text-overflow:clip!important}}
EOF
          fi
      - name: Commit and push develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "Fix mobile date display" || echo "No changes"
          git push origin develop
      - name: Remove one-time workflow from update
        run: |
          git fetch origin update
          git checkout -b update origin/update
          git rm .github/workflows/one-time-mobile-date-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time date fix workflow"
          git push origin update
