name: Fix 48.04 retry
on:
  push:
    branches: [develop]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js'); s=p.read_text()
          s=s.replace('const VERSION="48.03";','const VERSION="48.04";')
          s=s.replace('function clearDevRestoreKeys(){[STORAGE_KEYS.state,STORAGE_KEYS.sections,STORAGE_KEYS.stats].forEach(k=>localStorage.removeItem(k));}','function clearDevRestoreKeys(){[STORAGE_KEYS.state,STORAGE_KEYS.sections,STORAGE_KEYS.stats,LEGACY_STORAGE_KEYS.state].forEach(k=>localStorage.removeItem(k));}')
          s=s.replace('localStorage.setItem(STORAGE_KEYS.migrated,"1");location.reload();return;}','localStorage.setItem(STORAGE_KEYS.migrated,"complete");location.reload();return;}')
          s=s.replace('localStorage.setItem(STORAGE_KEYS.migrated,"1");location.reload();\n}','localStorage.setItem(STORAGE_KEYS.migrated,"complete");location.reload();\n}')
          s=s.replace('localStorage.removeItem(LEGACY_STORAGE_KEYS.state);localStorage.setItem(STORAGE_KEYS.migrated,"1");sessionStorage.setItem("moneyRuleDevV49MigrationCompleted","1");','localStorage.removeItem(LEGACY_STORAGE_KEYS.state);localStorage.setItem(STORAGE_KEYS.migrated,"complete");sessionStorage.setItem("moneyRuleDevV49MigrationCompleted","1");')
          helper='function setMigrationStateStatus(t){const e=$("migrationStateStatus");if(e)e.textContent=t;}\nfunction showLegacyMigrationGate(old,v49){if(!old)return false;$("migrationModal").classList.remove("hidden");setText("migrationStatus",v49?"旧ver.48.02検証データを検出しました。現在のVer.49仮データは移行成功時に置き換えます。先にバックアップを保存してください。":"旧ver.48.02検証データを検出しました。移行前バックアップを保存してから開始してください。");setMigrationStateStatus(v49?"移行待ち：旧ver.48.02検証データあり／Ver.49仮データあり":"移行待ち：旧ver.48.02検証データあり");return true;}\n\n'
          s=s.replace('function applySectionPrefs(){',helper+'function applySectionPrefs(){',1)
          b='''function bootstrap(){
  buildCategoryControls();buildDueSelect("fixedDue");buildDueSelect("fixedEditDue");bindEvents();
  const currentRaw=readJson(STORAGE_KEYS.state,null),normalized=normalizeCurrentState(currentRaw),legacyRaw=readJson(LEGACY_STORAGE_KEYS.state,null),marker=localStorage.getItem(STORAGE_KEYS.migrated);
  if(legacyRaw&&marker!=="complete"){showLegacyMigrationGate(legacyRaw,normalized);return;}
  if(normalized){state=normalized;selectedMonth=currentMonthKey();ensureMonthRecord(selectedMonth);loadMonthForms();resetEntryTab();renderAll();setMigrationStateStatus(marker==="complete"?"Ver.49形式：移行済み":"Ver.49形式：利用中（旧ver.48.02検証データは見つかりません）");if(sessionStorage.getItem("moneyRuleDevV49MigrationCompleted")==="1"){sessionStorage.removeItem("moneyRuleDevV49MigrationCompleted");setTimeout(()=>alert("Ver.49へのデータ移行が完了しました。"),50);}return;}
  if(legacyRaw){showLegacyMigrationGate(legacyRaw,null);return;}
  state=createEmptyState();state.months[currentMonthKey()]=createMonthRecord(null,null);save();localStorage.setItem(STORAGE_KEYS.migrated,"fresh");selectedMonth=currentMonthKey();loadMonthForms();resetEntryTab();renderAll();setMigrationStateStatus("旧ver.48.02検証データが見つからないため、新規Ver.49検証データとして開始しています。");
}
bootstrap();'''
          s=re.sub(r'function bootstrap\(\)\{.*?\n\}\nbootstrap\(\);',b,s,flags=re.S)
          p.write_text(s)
          h=Path('index.html').read_text().replace('48.03','48.04')
          h=h.replace('<div class="section-title"><h2>データ管理</h2><button class="minus-btn" data-section="data-tools">−</button></div>','<div class="section-title"><h2>データ管理</h2><button class="minus-btn" data-section="data-tools">−</button></div>\n    <p class="entry-hint" id="migrationStateStatus">移行状態を確認中...</p>',1)
          Path('index.html').write_text(h)
          Path('README.md').write_text('# 家計簿アプリ\n\n## ver.48.04\n- 旧ver.48.02検証データが残っている場合はVer.49仮データより移行画面を優先表示\n- 移行成功前は旧検証データを保持し、成功後にのみ整理\n- Ver.49仮データは移行成功時に安全に置き換え\n- データ管理に移行状態を表示\n')
          PY
          node --check app.js
          rm -f .github/workflows/fix-ver4804.yml .github/workflows/fix4804retry.yml
          rmdir .github/workflows .github || true
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix ver.48.04 migration recovery'
          git push origin HEAD:develop
