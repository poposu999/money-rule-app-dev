name: one-time-ver47-36
on:
  push:
    branches: [develop]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('style.css')
          s=p.read_text()
          s=s.replace('th:nth-child(1),.expense-table td:nth-child(1){width:8%!important;min-width:0!important}', 'th:nth-child(1),.expense-table td:nth-child(1){width:9%!important;min-width:0!important}')
          p.write_text(s)
          p=Path('README.md')
          p.write_text('''# 家計簿アプリ\n\n## ver.47.36\n- スマホの支出テーブルの日付幅を9%に変更\n- アプリの表示バージョンをVer.47.36に更新\n''')
          p=Path('sw.js')
          s=p.read_text().replace('money-rule-app-v47.35','money-rule-app-v47.36').replace('style.css?v=47.35','style.css?v=47.36').replace('app.js?v=47.35','app.js?v=47.36').replace('ver.47.35','ver.47.36')
          p.write_text(s)
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add style.css README.md sw.js
          git commit -m "ver.47.36: set mobile expense date width to 9%"
          git rm .github/workflows/one-time-ver47-36.yml
          git commit -m "chore: remove one-time workflow"
          git push
