name: Fix ver.48.04 migration detection

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Patch ver.48.04
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app=Path('app.js')
          s=app.read_text()
          def rep(old,new,count=1):
              global s
              found=s.count(old)
              if found < count:
                  raise SystemExit(f'expected at least {count} occurrence(s), found {found}: {old[:100]!r}')
              s=s.replace(old,new,count)

          rep('const VERSION="48.03";','const VERSION="48.04";')

          rep('function clearDevRestoreKeys(){[STORAGE_KEYS.state,STORAGE_KEYS.sections,STORAGE_KEYS.stats].forEach(k=>localStorage.removeItem(k));}',
              'function clearDevRestoreKeys(){[STORAGE_KEYS.state,STORAGE_KEYS.sections,STORAGE_KEYS.stats,LEGACY_STORAGE_KEYS.state].forEach(k=>localStorage.removeItem(k));}')

          # Successful full restores/conversions must be considered complete, not the old ambiguous "1" marker.
          s=s.replace('localStorage.setItem(STORAGE_KEYS.migrated,"1");location.reload();return;}',
                      'localStorage.setItem(STORAGE_KEYS.migrated,"complete");location.reload();return;}')
          s=s.replace('localStorage.setItem(STORAGE_KEYS.migrated,"1");location.reload();\n}',
                      'localStorage.setItem(STORAGE_KEYS.migrated,"complete");location.reload();\n}')

          # Successful in-app migration: remove legacy only after conversion+save verification succeeds.
          old='localStorage.removeItem(LEGACY_STORAGE_KEYS.state);localStorage.setItem(STORAGE_KEYS.migrated,"1");sessionStorage.setItem("moneyRuleDevV49MigrationCompleted","1");'
          new='localStorage.removeItem(LEGACY_STORAGE_KEYS.state);localStorage.setItem(STORAGE_KEYS.migrated,"complete");sessionStorage.setItem("moneyRuleDevV49MigrationCompleted","1");'
          rep(old,new)

          helper='''\nfunction setMigrationStateStatus(text){const el=$("migrationStateStatus");if(el)el.textContent=text;}\nfunction showLegacyMigrationGate(legacyRaw,normalized){\n  if(!legacyRaw)return false;\n  $("migrationModal").classList.remove("hidden");\n  const hasTemp=Boolean(normalized);\n  setText("migrationStatus",hasTemp?"旧ver.48.02検証データを検出しました。現在のVer.49仮データは、移行成功時に置き換えます。先にバックアップを保存してください。":"旧ver.48.02検証データを検出しました。移行前バックアップを保存してから開始してください。");\n  setMigrationStateStatus(hasTemp?"移行待ち：旧ver.48.02検証データあり／Ver.49仮データあり":"移行待ち：旧ver.48.02検証データあり");\n  return true;\n}\n'''
          anchor='function applySectionPrefs(){'
          if helper.strip() not in s:
              if anchor not in s: raise SystemExit('applySectionPrefs anchor missing')
              s=s.replace(anchor,helper+'\n'+anchor,1)

          # Bootstrap now checks legacy data BEFORE accepting an existing Ver.49 state.
          pattern=r'function bootstrap\(\)\{.*?\n\}\nbootstrap\(\);'
          m=re.search(pattern,s,flags=re.S)
          if not m: raise SystemExit('bootstrap block not found')
          bootstrap='''function bootstrap(){\n  buildCategoryControls();buildDueSelect("fixedDue");buildDueSelect("fixedEditDue");bindEvents();\n  const currentRaw=readJson(STORAGE_KEYS.state,null),normalized=normalizeCurrentState(currentRaw);\n  const legacyRaw=readJson(LEGACY_STORAGE_KEYS.state,null);\n  const migrationMarker=localStorage.getItem(STORAGE_KEYS.migrated);\n\n  // ver.48.04: legacy dev data always wins until a migration has actually completed.\n  // This recovers from ver.48.03 creating a temporary empty V49 state first.\n  if(legacyRaw&&migrationMarker!=="complete"){showLegacyMigrationGate(legacyRaw,normalized);return;}\n\n  if(normalized){\n    state=normalized;selectedMonth=currentMonthKey();ensureMonthRecord(selectedMonth);loadMonthForms();resetEntryTab();renderAll();\n    setMigrationStateStatus(migrationMarker==="complete"?"Ver.49形式：移行済み":"Ver.49形式：利用中（旧ver.48.02検証データは見つかりません）");\n    if(sessionStorage.getItem("moneyRuleDevV49MigrationCompleted")==="1"){sessionStorage.removeItem("moneyRuleDevV49MigrationCompleted");setTimeout(()=>alert("Ver.49へのデータ移行が完了しました。"),50);}\n    return;\n  }\n\n  if(legacyRaw){showLegacyMigrationGate(legacyRaw,null);return;}\n\n  state=createEmptyState();state.months[currentMonthKey()]=createMonthRecord(null,null);save();\n  localStorage.setItem(STORAGE_KEYS.migrated,"fresh");\n  selectedMonth=currentMonthKey();loadMonthForms();resetEntryTab();renderAll();\n  setMigrationStateStatus("旧ver.48.02検証データが見つからないため、新規Ver.49検証データとして開始しています。");\n}\nbootstrap();'''
          s=s[:m.start()]+bootstrap+s[m.end():]
          app.write_text(s)

          idx=Path('index.html')
          h=idx.read_text()
          h=h.replace('style.css?v=48.03','style.css?v=48.04')
          h=h.replace('app.js?v=48.03','app.js?v=48.04')
          h=h.replace('ver.48.03','ver.48.04')
          old='<div class="section-title"><h2>データ管理</h2><button class="minus-btn" data-section="data-tools">−</button></div>\n    <h3>データ整合性チェック</h3>'
          new='<div class="section-title"><h2>データ管理</h2><button class="minus-btn" data-section="data-tools">−</button></div>\n    <p class="entry-hint" id="migrationStateStatus">移行状態を確認中...</p>\n    <h3>データ整合性チェック</h3>'
          if old not in h: raise SystemExit('data-tools anchor missing')
          h=h.replace(old,new,1)
          idx.write_text(h)

          Path('README.md').write_text('''# 家計簿アプリ\n\n## ver.48.04\n- Ver.49仮データが先に存在していても、旧ver.48.02検証データが残っている場合は移行画面を優先表示するよう修正\n- 移行成功前は旧ver.48.02検証データを削除せず、移行成功後にのみ旧データを整理するよう移行状態を明確化\n- 誤って作成されたVer.49仮データは、旧データの移行成功時に安全に置き換える仕様に変更\n- データ管理に移行状態を表示し、旧検証データの有無や移行済み状態を確認できるよう改善\n- app.js / index.html / README.md / アプリ下部のバージョン表記を ver.48.04 に統一\n''')
          PY

          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text()
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit(f'duplicate HTML ids: {dup}')
          js=Path('app.js').read_text()
          refs=set(re.findall(r'\$\("([A-Za-z0-9_-]+)"\)',js))
          missing=sorted(refs-set(ids))
          if missing: raise SystemExit(f'missing HTML ids referenced by $(): {missing}')
          if '48.03' in Path('app.js').read_text() or '48.03' in h or '48.03' in Path('README.md').read_text():
              raise SystemExit('stale 48.03 reference remains')
          PY

          rm -f .github/workflows/fix-ver4804.yml
          rmdir .github/workflows .github 2>/dev/null || true
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          test ! -d .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix ver.48.04 migration recovery"
          git push origin HEAD:develop
