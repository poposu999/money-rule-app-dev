name: one-time ver47.37 table style
on:
  push:
    branches: [develop]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply table style unification
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          s = s.replace('style.css?v=47.34', 'style.css?v=47.37')
          s = s.replace('app.js?v=47.34', 'app.js?v=47.37')
          unified = '''
          /* ver.47.37: unify all expense-table visual styling */
          @media(max-width:600px){
            .expense-table-wrap{overflow-x:hidden!important;width:100%!important}
            .expense-table{width:100%!important;min-width:0!important;table-layout:fixed!important;font-size:10px!important}
            .expense-table th,.expense-table td{font-size:10px!important;padding:4px 2px!important;line-height:1.05!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
            .expense-table th{font-weight:600!important;background:#f8f8f8!important;color:#777!important}
            .expense-table th:nth-child(1),.expense-table td:nth-child(1){width:9%!important;min-width:0!important}
            .expense-table th:nth-child(2),.expense-table td:nth-child(2){width:30%!important;min-width:0!important}
            .expense-table th:nth-child(3),.expense-table td:nth-child(3){width:14%!important;min-width:0!important}
            .expense-table th:nth-child(4),.expense-table td:nth-child(4){width:18%!important;min-width:0!important}
            .expense-table th:nth-child(5),.expense-table td:nth-child(5){width:29%!important;min-width:0!important}
            .expense-table .amount-col{white-space:nowrap!important;text-align:right!important;padding-right:5px!important}
            .expense-table .amount-col strong{font-weight:400!important;white-space:nowrap!important}
            .expense-table .action-col{white-space:nowrap!important;text-align:right!important}
            .expense-table .action-col .edit-delete-buttons{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:2px!important;flex-wrap:nowrap!important;white-space:nowrap!important}
            .expense-table .action-col button{margin:0!important;padding:3px 3px!important;font-size:8px!important;line-height:1.05!important;min-width:0!important;white-space:nowrap!important}
            .expense-table .confirm-btn,.expense-table .fixed-paid,.expense-table .edit-btn,.expense-table .delete-btn{font-size:8px!important;padding:3px 3px!important;margin-left:2px!important}
          }
          .expense-table .confirm-btn,.expense-table .fixed-paid{margin:0 0 0 5px;padding:5px 8px;font-size:11px;line-height:normal}
          '''
          marker = '</style>'
          if 'ver.47.37: unify all expense-table visual styling' not in s:
              s = s.replace(marker, unified + '\n' + marker, 1)
          index.write_text(s)

          css = Path('style.css')
          c = css.read_text()
          if 'ver.47.37: unify all expense-table visual styling' not in c:
              c += '''\n/* ver.47.37: unify all expense-table visual styling */\n.expense-table{font-size:14px}\n.expense-table th,.expense-table td{font-size:14px;padding:10px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}\n.expense-table th{font-size:12px;font-weight:600;color:#777;background:#f8f8f8}\n@media(max-width:600px){\n .expense-table{width:100%!important;min-width:0!important;table-layout:fixed!important;font-size:10px!important}\n .expense-table th,.expense-table td{font-size:10px!important;padding:4px 2px!important;line-height:1.05!important}\n .expense-table th{font-weight:600!important;background:#f8f8f8!important;color:#777!important}\n .expense-table th:nth-child(1),.expense-table td:nth-child(1){width:9%!important;min-width:0!important}\n .expense-table th:nth-child(2),.expense-table td:nth-child(2){width:30%!important;min-width:0!important}\n .expense-table th:nth-child(3),.expense-table td:nth-child(3){width:14%!important;min-width:0!important}\n .expense-table th:nth-child(4),.expense-table td:nth-child(4){width:18%!important;min-width:0!important}\n .expense-table th:nth-child(5),.expense-table td:nth-child(5){width:29%!important;min-width:0!important}\n .expense-table .amount-col{white-space:nowrap!important;text-align:right!important;padding-right:5px!important}\n .expense-table .amount-col strong{font-weight:400!important;white-space:nowrap!important}\n .expense-table .action-col{white-space:nowrap!important;text-align:right!important}\n .expense-table .action-col .edit-delete-buttons{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:2px!important;flex-wrap:nowrap!important;white-space:nowrap!important}\n .expense-table .action-col button{margin:0!important;padding:3px 3px!important;font-size:8px!important;line-height:1.05!important;min-width:0!important;white-space:nowrap!important}\n .expense-table .confirm-btn,.expense-table .fixed-paid,.expense-table .edit-btn,.expense-table .delete-btn{font-size:8px!important;padding:3px 3px!important;margin-left:2px!important}\n}\n'''
          css.write_text(c)

          Path('README.md').write_text('''# 家計簿アプリ\n\n## ver.47.37\n- 今月の支出・予定支出・固定費一覧のテーブルデザインを統一\n- 各テーブルのフォントサイズ・余白・表頭・列幅を統一\n- 支出の「支出に確定」「支払済み」などの独自操作は維持\n- アプリの表示バージョンをVer.47.37に更新\n''')

          sw = Path('sw.js')
          w = sw.read_text()
          w = w.replace('money-rule-app-v47.36', 'money-rule-app-v47.37')
          w = w.replace('style.css?v=47.36', 'style.css?v=47.37')
          w = w.replace('app.js?v=47.36', 'app.js?v=47.37')
          w = w.replace('ver.47.36', 'ver.47.37')
          if '47.37' not in w:
              raise SystemExit('sw.js version update failed')
          sw.write_text(w)
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css README.md sw.js .github/workflows/one-time-ver47-37.yml
          git commit -m "ver.47.37: unify table design"
          git rm .github/workflows/one-time-ver47-37.yml
          git commit -m "chore: remove one-time ver47.37 workflow"
          git push
